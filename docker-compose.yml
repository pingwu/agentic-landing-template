# Agentic Landing Template - Docker Compose
#
# Start the page:      docker compose up
# Stop it:             docker compose down
# Production preview:  docker compose --profile prod up --build   (http://localhost:3001)
#
# The page opens at http://localhost:3000. Ports listen on this computer only (127.0.0.1).
# To use another port:  PORT=3100 docker compose up   (macOS/Linux)

services:
  # ============================================================
  # DEV - Hot-reload development (starts by default)
  # ============================================================
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace:cached
      - node_modules:/workspace/node_modules
      - next_cache:/workspace/.next
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Needed so edits show up on Windows
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - app-network

  # ============================================================
  # APP - Production build preview (opt in with --profile prod)
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    profiles:
      - prod

volumes:
  node_modules:
    name: agentic-landing-node-modules
  next_cache:
    name: agentic-landing-next-cache

networks:
  app-network:
    driver: bridge
